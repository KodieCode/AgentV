# Off-box host map for cross-host notify delivery + wake.
# Format: host<TAB>ssh_alias<TAB>remote_tmux_path
#   host            = the agents.host value for agents on that box
#   ssh_alias       = an entry in ~/.ssh/config reachable from the control-plane box
#   remote_tmux_path= FULL path to tmux on that host (non-interactive ssh has a
#                     minimal PATH). Find it with: ssh <alias> 'command -v tmux'
#
# Single-box fleets need nothing here. Example for a mac-mini worker:
# macmini	macmini	/opt/homebrew/bin/tmux
